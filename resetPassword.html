<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      eVentory | Lightweight Inventory & Sales Management for African SMEs
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />

    <link rel="stylesheet" href="resetPassword.css" />
  </head>

  <body>
    <main class="main-container">
      <!-- Login Section -->

      <section class="reset-container">
        <div class="reset-logo">
          <a href="index.html">
            <img src="./Asset/logo.png" alt="eVentory logo" />
          </a>
        </div>

        <header class="reset-header-text">
          <h1 class="reset-header">Reset Password</h1>
          <p class="reset-paragraph">
            Enter your new password to reset your password.
          </p>
        </header>

        <form class="reset-form">
          <div class="reset-input-container">
            <div class="form-group password-input-one">
              <label for="password">New Password</label>
              <input
                type="password"
                placeholder="Password"
                id="new-password"
                name="newPassword"
              />
              <i class="ph ph-eye-slash"></i>
              <small class="error-message"></small>
            </div>

            <div class="form-group password-input-two">
              <label for="password">Confirm Password</label>
              <input
                type="password"
                placeholder="Password"
                id="confirm-password"
                name="confirmPassword"
              />
              <i class="ph ph-eye-slash"></i>
              <small class="error-message"></small>
            </div>

            <div class="remember-me">
              <input type="checkbox" id="remember-me" />
              <label for="remember-me">Remember me</label>
            </div>
          </div>
          <button type="submit" class="btn confirm-btn">
            Click Here to Confirm
          </button>
        </form>
        <a href="loginPage.html" class="back-to-login"
          ><i class="ph ph-arrow-left"></i> Back to Login</a
        >
      </section>

      <!-- Illustration Section -->
      <div class="reset-img">
        <img
          src="Asset/password-updated.png"
          alt="An Illustration of a Shield Signifying that Password is Updated Successfully"
          class="reset-illustration"
        />
      </div>
    </main>
    <script src="resetPassword.js"></script>
  </body>
</html>
