<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      eVentory | Lightweight Inventory & Sales Management for African SMEs
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />

    <link rel="stylesheet" href="loginPage.css" />
  </head>

  <body>
    <main class="main-container">
      <!-- Login Section -->

      <section class="login-container">
        <div class="login-logo">
          <a href="index.html">
            <img src="./Asset/logo.png" alt="eVentory logo" />
          </a>
        </div>

        <header class="login-header-text">
          <h1 class="login-header">Welcome back to eVentory!</h1>
          <p class="header-main-text">
            Welcome back! Please enter your details
          </p>
        </header>

        <form class="login-form">
          <div class="login-input-container">
            <div class="form-group">
              <label for="email">Email</label>
              <input
                type="email"
                placeholder="example@mail.com"
                id="email"
                name="email"
              />
              <small class="error-message"></small>
            </div>

            <div class="form-group password-input">
              <label for="password">Password</label>
              <input
                type="password"
                placeholder="Password"
                id="password"
                name="password"
              />
              <i class="ph ph-eye-slash"></i>
              <small class="error-message"></small>
            </div>

            <div class="login-options">
              <div class="remember-me">
                <input type="checkbox" id="remember-me" />
                <label for="remember-me">Remember me</label>
              </div>

              <a href="#" class="login-forgot-password">Forgot password?</a>
            </div>
          </div>
          <button type="submit" class="btn login-btn">Log in</button>
        </form>
        <p class="new-user">
          New User?
          <a href="#" class="signup">Sign Up</a>
        </p>
      </section>

      <!-- Illustration Section -->
      <aside class="login-img">
        <img
          src="Asset/side-illustration.png"
          alt="Side Illustration"
          class="login-illustration"
        />
      </aside>
    </main>
    <script src="loginPage.js"></script>
  </body>
</html>
