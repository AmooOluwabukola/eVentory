<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suppliers — eVentory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dashboard-layout.css" />
    <link rel="stylesheet" href="supplier.css" />
  </head>
  <body>
    <div id="page" data-page="supplier" data-title="Suppliers" data-subtitle="">

      <template data-page-actions>
        <button type="button" class="btn btn-primary" id="add-supplier-btn">+ Add Supplier</button>
      </template>

      <p class="supplier-count-text" id="supplier-count-text"></p>

      <div class="panel">
        <div class="table-toolbar">
          <label class="table-search">
            <span class="search-icon" data-icon="search"></span>
            <input type="search" id="supplier-search" placeholder="Search by name, contact, or category..." />
          </label>
        </div>

        <div class="suppliers-grid" id="suppliers-grid"></div>
      </div>
    </div>

    <!-- Shared modal -->
    <div class="modal-overlay" id="modal-overlay" hidden>
      <div class="modal-box" id="modal-box" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h3 class="modal-title" id="modal-title">Title</h3>
          <button type="button" class="modal-close" id="modal-close">
            <span data-p-icon="close"></span>
          </button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <script src="api.js"></script>
    <script src="dashboard-layout.js"></script>
    <script src="supplier.js"></script>
  </body>
</html>
