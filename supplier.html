<html lang="en">
<head>

    <link rel="stylesheet" href="dashboard-layout.css" />

<style>
  :root {
    --brand: oklch(0.52 0.26 285);
    --brand-strong: oklch(0.44 0.24 285);
    --brand-soft: oklch(0.95 0.03 285);
    --surface: oklch(0.98 0.004 285);
    --panel: oklch(1 0 0);
    --line: oklch(0.92 0.008 285);
    --text: oklch(0.22 0.02 285);
    --muted-2: oklch(0.58 0.02 285);
    --star: oklch(0.79 0.16 78);
    --ok: oklch(0.62 0.17 150);
    --warn: oklch(0.72 0.17 60);
    --destructive: oklch(0.577 0.245 27.325);
    --shadow-card: 0 1px 2px oklch(0.2 0.02 285 / 0.06), 0 8px 24px oklch(0.2 0.02 285 / 0.06);
  }
  .dark {
    --brand-soft: oklch(0.3 0.07 285);
    --surface: oklch(0.16 0.02 285);
    --panel: oklch(0.21 0.02 285);
    --line: oklch(1 0 0 / 12%);
    --text: oklch(0.97 0.005 285);
    --muted-2: oklch(0.72 0.02 285);
    --destructive: oklch(0.704 0.191 22.216);
    --shadow-card: 0 8px 24px oklch(0 0 0 / 0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--surface); }

  .app {
    display: flex;
    min-height: 100vh;
    background: var(--surface);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  button, input { font-family: inherit; }

  .sidebar {
    width: 232px;
    flex: 0 0 232px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 18px 14px;
    gap: 6px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 4px 6px 18px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--brand); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 15px;
  }
  .brand-name { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
  .nav-label { font-size: 11px; letter-spacing: .08em; color: var(--muted-2); padding: 12px 8px 6px; font-weight: 600; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 10px;
    font-size: 14px; color: var(--text); background: none; border: 0;
    width: 100%; cursor: pointer; text-align: left;
  }
  .nav-item:hover { background: var(--brand-soft); }
  .nav-item.active { background: var(--brand); color: #fff; font-weight: 600; }
  .nav-item svg { width: 17px; height: 17px; flex: 0 0 auto; }

  .upgrade {
    margin-top: auto; border: 1px solid var(--line); border-radius: 18px;
    padding: 16px; text-align: center; background: var(--brand-soft);
  }
  .upgrade h4 { font-size: 18px; font-weight: 800; color: var(--brand-strong); margin: 8px 0 6px; }
  .upgrade p { font-size: 12px; color: var(--muted-2); margin-bottom: 12px; }
  .upgrade-btn {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; padding: 8px 8px 8px 16px; border-radius: 999px;
    border: 1px solid var(--brand); background: var(--panel); color: var(--text);
    font-weight: 600; cursor: pointer;
  }
  .upgrade-btn span:last-child {
    width: 30px; height: 30px; border-radius: 999px; background: var(--brand); color: #fff;
    display: grid; place-items: center;
  }

  .upgrade-card {
  position: relative;
  background: linear-gradient(180deg, #ffffff 0%, #f5f3fb 100%);
  border-radius: 24px;
  box-shadow: 0 8px 24px rgba(90, 60, 220, 0.10);
  padding: 90px 20px 20px;
  text-align: center;
  max-width: 340px;
  margin: 60px auto 0;
}

.upgrade-bag-wrap {
  position: absolute;
  top: -60px;
  left: 50%;
  transform: translateX(-50%);
  width: 160px;
}

.upgrade-bag {
  width: 100%;
  height: auto;
  display: block;
}

.upgrade-card h4 {
  color: #5b2ce0;
  font-size: 1.6rem;
  font-weight: 800;
  margin: 0 0 10px;
}

.upgrade-card p {
  color: #6b7280;
  font-size: 0.95rem;
  line-height: 1.45;
  margin: 0 0 22px;
}

.upgrade-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #fff;
  border: 2px solid #5b2ce0;
  border-radius: 999px;
  padding: 5px 5px 5px 24px;
  font-size: 1.05rem;
  font-weight: 800;
  color: #111827;
  cursor: pointer;
}

.upgrade-btn-arrow {
  background: #5b2ce0;
  color: #fff;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 12px;
    padding: 14px 22px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  .topbar h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 999px; border: 0; background: transparent;
    color: var(--muted-2); display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:hover { background: var(--brand-soft); color: var(--brand-strong); }
  .icon-btn.on { background: var(--brand); color: #fff; }
  .avatar { width: 34px; height: 34px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .user { display: flex; align-items: center; gap: 8px; min-width: 0; cursor: default; }
  .user small { display: block; color: var(--muted-2); font-size: 11px; }
  .user b { font-size: 13px; }
  .menu-toggle { display: none; }

  .content { padding: 22px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow-card); }
  .panel-head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .search { position: relative; flex: 1 1 240px; max-width: 320px; }
  .search input {
    width: 100%; padding: 9px 12px 9px 34px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 13px;
  }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted-2); }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 8px;
    background: var(--brand); color: #fff; border: 0; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-primary:hover { background: var(--brand-strong); }
  .btn-ghost { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 13px; cursor: pointer; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--panel); transition: box-shadow .2s, transform .2s; }
  .card:hover { box-shadow: var(--shadow-card); transform: translateY(-2px); }
  .card-top { display: flex; gap: 10px; align-items: flex-start; }
  .card-logo { width: 34px; height: 34px; border-radius: 9px; background: var(--brand-soft); display: grid; place-items: center; font-size: 17px; flex: 0 0 auto; }
  .card-top h3 { font-size: 14px; font-weight: 700; margin: 0; }
  .card-top p { font-size: 11px; color: var(--muted-2); margin: 2px 0 0; }
  .rating { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted-2); margin-top: 3px; }
  .rating .stars { color: var(--star); letter-spacing: 1px; }
  .card-meta { margin-top: 12px; display: grid; gap: 6px; font-size: 12px; color: var(--muted-2); }
  .card-meta div { display: flex; gap: 7px; align-items: center; }
  .card-meta svg { width: 13px; height: 13px; flex: 0 0 auto; }
  .card-stats { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
  .card-stats b { display: block; font-size: 15px; }
  .card-stats span { font-size: 10px; color: var(--muted-2); }
  .card-stats .v-orders { color: var(--brand); }
  .card-stats .v-pending-0 { color: var(--ok); }
  .card-stats .v-pending { color: var(--warn); }
  .card-stats .date b { font-size: 11px; font-weight: 600; }
  .card-actions { display: flex; gap: 8px; margin-top: 12px; }
  .link-btn { background: none; border: 0; color: var(--brand); font-size: 12px; font-weight: 600; cursor: pointer; padding: 0; }
  .link-btn.danger { color: var(--destructive); }
  .empty { text-align: center; padding: 40px; color: var(--muted-2); font-size: 14px; }

  .overlay { position: fixed; inset: 0; background: oklch(0.2 0.02 285 / 0.45); display: grid; place-items: center; padding: 16px; z-index: 50; }
  .overlay.hidden { display: none; }
  .modal { width: 100%; max-width: 420px; background: var(--panel); border-radius: 12px; padding: 20px; box-shadow: 0 24px 60px oklch(0 0 0 / 0.25); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-head h2 { font-size: 17px; font-weight: 700; margin: 0; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 10px; letter-spacing: .06em; font-weight: 600; color: var(--muted-2); margin-bottom: 5px; }
  .field input { width: 100%; padding: 9px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 13px; }
  .field input:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .err { color: var(--destructive); font-size: 11px; margin-top: 4px; }

  .backdrop-nav { display: none; }
  .backdrop-nav.show { display: block; position: fixed; inset: 0; background: oklch(0.2 0.02 285 / 0.4); z-index: 55; }
  @media (max-width: 900px) {
    .menu-toggle { display: grid; }
    .sidebar { position: fixed; z-index: 60; left: 0; top: 0; transform: translateX(-100%); transition: transform .25s ease; }
    .sidebar.open { transform: translateX(0); }
    .app { display: block; }
    .content { padding: 14px; }
    .panel { padding: 12px; }
    .topbar { padding: 12px 14px; }
    .user .user-text { display: none; }
  }
  @media (max-width: 480px) {
    .row-2 { grid-template-columns: 1fr; }
    .topbar h1 { font-size: 18px; }
  }
</style>
</head>

<div class="app" id="app">

(function () {

  function starsHtml(rating) {
    const full = Math.round(rating);
    const filled = "★★★★★".slice(0, full);
    const rest = "★★★★★".slice(0, 5 - full);
    return `<div class="rating"><span class="stars" aria-hidden="true">${filled}<span style="opacity:.3">${rest}</span></span><span>${rating.toFixed(1)}</span></div>`;
  }

  function renderNav() {
    navItemsEl.innerHTML = NAV.map(
      (n) => `<button class="nav-item${active === n.label ? " active" : ""}" data-label="${n.label}">${ICONS[n.icon]} ${n.label}</button>`

    navItemsEl.querySelectorAll(".nav-item").forEach((btn) => {
      btn.addEventListener("click", () => {

    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function renderGrid() {
    const q = query.trim().toLowerCase();
    const filtered = !q
      ? suppliers
      : suppliers.filter((s) => [s.name, s.category, s.contact, s.phone].some((v) => v.toLowerCase().includes(q)));

    if (filtered.length === 0) {

        </div>
        <div class="card-stats">
          <div><b class="v-orders">${s.orders}</b><span>Orders</span></div>
          <div><b class="${s.pending === 0 ? "v-pending-0" : "v-pending"}">${s.pending}</b><span>Pending</span></div>

        </div>
      </article>`
      )
      .join("")}</div>`;

    gridWrap.querySelectorAll('[data-action="edit"]').forEach((btn) =>

    gridWrap.querySelectorAll('[data-action="delete"]').forEach((btn) =>
      btn.addEventListener("click", () => {
        suppliers = suppliers.filter((s) => s.id !== Number(btn.dataset.id));
        renderGrid();
      })
    );
  }

  function setForm(vals) {

  function openEdit(id) {
