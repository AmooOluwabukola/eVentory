<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products — eVentory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dashboard-layout.css" />
    <link rel="stylesheet" href="product.css" />
  </head>
  <body>
    <div id="page" data-page="product" data-title="Products" data-subtitle="">

      <template data-page-actions>
        <!-- <button type="button" class="btn btn-ghost" id="snap-photo-btn">
          <span class="btn-icon" data-p-icon="camera"></span>
          Snap Photo
        </button> -->
        <button type="button" class="btn btn-primary" id="add-product-btn">+ Add Product</button>
      </template>

      <!-- ===================== List view ===================== -->
      <div id="product-list-view">
        <p class="product-count-text" id="product-count-text"></p>

        <div class="panel">
          <div class="table-toolbar">
            <label class="table-search">
              <span class="search-icon" data-icon="search"></span>
              <input type="search" id="product-search" placeholder="Search by name or SKU..." />
            </label>
            <span class="select-wrap toolbar-select">
              <select id="category-filter">
                <option value="">All categories</option>
              </select>
              <span class="select-caret" data-icon="chevronDown"></span>
            </span>
            <div class="view-toggle" role="group" aria-label="View mode">
              <button type="button" class="view-toggle-btn is-active" data-view="list" data-icon="menu" aria-label="List view"></button>
              <button type="button" class="view-toggle-btn" data-view="grid" data-icon="viewGrid" aria-label="Grid view"></button>
            </div>
          </div>

          <table class="products-table" id="products-table">
            <thead>
              <tr>
                <th>PRODUCT</th>
                <th>SKU</th>
                <th>CATEGORY</th>
                <th>PRICE</th>
                <th>STOCK</th>
                <th>STATUS</th>
                <th>ACTIONS</th>
              </tr>
            </thead>
            <tbody id="products-tbody"></tbody>
          </table>

          <div class="products-grid" id="products-grid" hidden></div>
        </div>
      </div>

      <!-- ===================== Detail view ===================== -->
      <div id="product-detail-view" hidden>
        <div class="detail-head">
          <div class="detail-head-left">
            <button type="button" class="btn btn-ghost" id="back-to-products-btn">
              <span class="btn-icon" data-p-icon="arrowLeft"></span>
              Back
            </button>
            <h2 class="detail-title" id="detail-product-name">Product</h2>
          </div>
          <div class="detail-head-actions">
            <button type="button" class="btn btn-ghost" id="detail-edit-btn">
              <span class="btn-icon" data-p-icon="edit"></span>
              Edit
            </button>
            <button type="button" class="btn btn-danger" id="detail-delete-btn">
              <span class="btn-icon" data-p-icon="trash"></span>
              Delete
            </button>
          </div>
        </div>

        <div class="detail-grid">
          <div class="detail-left">
            <div class="panel product-image-card" id="product-image-card"></div>

            <div class="panel stock-status-card">
              <h3 class="detail-card-title">Stock Status</h3>
              <p class="stock-count" id="stock-count">— units</p>
              <div class="stock-bar-track">
                <div class="stock-bar-fill" id="stock-bar-fill"></div>
              </div>
              <p class="stock-min" id="stock-min">Min. stock: —</p>
              <button type="button" class="btn btn-primary stock-adjust-btn" id="adjust-stock-btn">Adjust Stock</button>
            </div>
          </div>

          <div class="detail-right">
            <div class="panel">
              <h3 class="detail-card-title">Product Details</h3>
              <dl class="details-grid" id="product-details-grid"></dl>
            </div>

            <div class="panel">
              <h3 class="detail-card-title">Stock History</h3>
              <ul class="history-list" id="stock-history-list"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Shared modal -->
    <div class="modal-overlay" id="modal-overlay" hidden>
      <div class="modal-box" id="modal-box" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h3 class="modal-title" id="modal-title">Title</h3>
          <button type="button" class="modal-close" id="modal-close">
            <span data-p-icon="close"></span>
          </button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <input type="file" id="snap-photo-input" accept="image/*" capture="environment" hidden />

    <script src="api.js"></script>
    <script src="dashboard-layout.js"></script>
    <script src="product.js"></script>
  </body>
</html>
