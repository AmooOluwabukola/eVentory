<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      eVentory | Lightweight Inventory & Sales Management for African SMEs
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="passwordUpdated.css" />
  </head>
  <body>
    <div class="overall-container">
      <header class="password-updated-logo">
        <img src="Asset/logo.png" alt="eVentory Logo" />
      </header>
      <main class="main-content">
        <section class="hero-section">
          <div class="hero-image">
            <img
              src="Asset/password-updated.png"
              alt="Shield illustration indicating the password was updated successfully"
            />
          </div>

          <div class="hero-content">
            <h2 class="hero-header">Password updated successfully!</h2>
            <p class="hero-paragraph">
              You can sign in using your new password.
            </p>
          </div>
        </section>
        <div class="login-btn">
          <a href="loginPage.html">Continue to login</a>
        </div>
      </main>
    </div>
    <script src="passwordUpdated.js"></script>
